const catsOn=d=>{const c=[]; if(bdaysOn(d).length||DATA.feste.some(f=>f.data===Y(d))) c.push('compleanni'); evOn(d).forEach(e=>{const k=catKey(e.categoria); if(!c.includes(k)) c.push(k)}); return c};
const docLink=f=>(f&&f.url)?'<a class="dl" href="'+esc(f.url)+'" download target="_blank" rel="noopener">'+DLICON+esc(f.nome||'Scarica il documento')+'</a>':'';
function icsLink(e){
  const pad=n=>String(n).padStart(2,'0'), ymd=t=>t.replace(/-/g,'');
  const a=e.dal, z=e.al||e.dal, ex=Y(addD(P(z),1));
  const m=String(e.ora||'').match(/(\d{1,2})[:.](\d{2})(?:\s*[-–]\s*(\d{1,2})[:.](\d{2}))?/);
  let ds,de;
  if(m){ds='DTSTART:'+ymd(a)+'T'+pad(m[1])+m[2]+'00'; de='DTEND:'+ymd(z)+'T'+(m[3]?pad(m[3])+m[4]:pad((+m[1]+1)%24)+m[2])+'00';}
  else {ds='DTSTART;VALUE=DATE:'+ymd(a); de='DTEND;VALUE=DATE:'+ymd(ex);}
  const q=t=>String(t||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/[,;]/g,'\\$&');
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Sez 1C//IT','BEGIN:VEVENT','UID:'+ymd(a)+'-'+String(e.titolo).replace(/\W/g,'')+'@sez1c','DTSTAMP:'+ymd(Y(TODAY))+'T000000Z',ds,de,'SUMMARY:'+q(e.titolo),e.luogo?'LOCATION:'+q(e.luogo):'',e.testo?'DESCRIPTION:'+q(e.testo):'','END:VEVENT','END:VCALENDAR'].filter(Boolean).join('\r\n');
  return '<a class="dl alt" download="evento.ics" href="data:text/calendar;charset=utf-8,'+encodeURIComponent(ics)+'">'+CALICON+'Aggiungi al mio calendario</a>';
}
const CALICON='<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4M12 13v5M9.5 15.5h5"/></svg>';
function evHTML(e){
  const k=catKey(e.categoria), a=P(e.dal), b=P(e.al||e.dal);
  const when=(e.al&&e.al!==e.dal)?'dal '+longDate(a)+' al '+longDate(b):longDate(a);
  return '<div class="party evt">'+catPill(k)+(isNew(e)?NEW:'')+(e.esempio?EXA:'')+'<h3 style="margin-top:6px">'+esc(e.titolo)+'</h3><div class="muted">'+esc(when)+(e.ora?' · ore '+esc(e.ora):'')+'</div>'+(e.luogo?'<div>'+esc(e.luogo)+'</div>':'')+(e.testo?'<p style="margin:6px 0 0">'+esc(e.testo)+'</p>':'')+(e.costo?'<div class="muted">Costo: '+esc(e.costo)+'</div>':'')+(e.scadenza?'<div class="exp">Iscrizione entro '+esc(longDate(P(e.scadenza)))+'</div>':'')+'<div class="acts">'+icsLink(e)+docLink(e.file)+'</div></div>';
}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NOW=window.__TODAY?P(window.__TODAY):new Date(); const TODAY=new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate());
const C=DATA.config, S0=P(C.inizioScuola), S1=P(C.fineScuola), M0=P(C.menuDa), M1=P(C.menuA);
const monday=d=>addD(d,-((d.getDay()+6)%7));
const longDate=d=>GIORNI[d.getDay()]+' '+d.getDate()+' '+MESI[d.getMonth()];

function closureOf(d){
  for(const c of DATA.chiusure){ if(d>=P(c.dal)&&d<=P(c.al||c.dal)) return c.nome }
  return null;
}
function status(d){ // {open, why}
  if(d<S0) return {open:false,why:'La scuola non è ancora iniziata'};
  if(d>S1) return {open:false,why:'Anno scolastico concluso'};
  const w=d.getDay(), c=closureOf(d); if(w===0||w===6) return {open:false,why:c||'Fine settimana',we:true,closure:!!c};
  if(c) return {open:false,why:c,closure:true};
  return {open:true};
}
function menuWeek(d){ const m=monday(d), n=Math.floor((m.getDate()-1)/7)+1; return {n, menu:n>4?C.quintaSettimana:n}; }
function menuFor(d){
  if(!status(d).open) return null;
  if(d<M0||d>M1) return {missing:true};
  const mw=menuWeek(d); return {mw, items:DATA.menu[mw.menu][KEYS[d.getDay()-1]]};
}
function modsOf(d){return DATA.variazioni.filter(v=>v.data===Y(d))}
function bdayDate(b){const y=b.mese>=9?S0.getFullYear():S1.getFullYear();return new Date(y,b.mese-1,b.giorno)}
function bdaysOn(d){return DATA.compleanni.filter(b=>{const x=bdayDate(b);return x.getTime()===d.getTime()})}
function festeOf(nome){return DATA.feste.filter(f=>f.bimbo===nome)}
function mealHTML(items){
  const main=items.filter(x=>x!=='Pane'&&!/^Frutta/.test(x));
  const lead=(it)=>'<li>'+esc(it)+'</li>';
  return '<ul class="meal">'+main.map(lead).join('')+'</ul><div class="chips"><span class="chip">Pane</span><span class="chip fr">Frutta fresca di stagione</span></div>';
}
function alertHTML(d){return modsOf(d).map(v=>'<div class="alert"><b>Variazione del menù</b><br>'+esc(v.testo)+'</div>').join('')}

/* ---------- viste ---------- */
const DLICON='<svg viewBox="0 0 24 24"><path d="M12 3v12M7 11l5 5 5-5M5 21h14"/></svg>';
function bannerBday(){
  return bdaysOn(TODAY).map(b=>{
    const dots=['#FFC83D','#1FB8A8','#4C97FF','#5BC46B','#fff','#FFC83D','#1FB8A8','#fff'].map((c,i)=>'<i style="background:'+c+';top:'+[8,60,14,70,36,80,50,24][i]+'%;left:'+[84,92,70,6,94,24,3,52][i]+'%;transform:rotate('+(i*37)+'deg)"></i>').join('');
    return '<section class="card bday">'+dots+'<div class="kicker" style="color:#fff;opacity:.85">Oggi si festeggia</div><div class="big">Buon compleanno, '+esc(b.nome)+'!</div><div class="sub">Oggi '+(b.anni?esc(b.nome)+' compie '+b.anni+' anni':'è il suo compleanno')+'</div></section>';
  }).join('');
}
function newsHTML(){
  const der=(DATA.eventi||[]).filter(e=>e.scadenza&&P(e.scadenza)>=TODAY&&P(e.scadenza)<=addD(TODAY,7)&&P(e.al||e.dal)>=TODAY).map(e=>({data:Y(TODAY),titolo:'Iscrizione: '+e.titolo,testo:longDate(P(e.dal))+(e.ora?' · ore '+e.ora:'')+(e.luogo?' · '+e.luogo:''),scadenza:e.scadenza,file:e.file,esempio:e.esempio}));
  const items=(DATA.comunicazioni||[]).filter(n=>{const from=P(n.data); const to=n.scadenza?P(n.scadenza):addD(from,14); return from<=TODAY&&TODAY<=to}).sort((a,b)=>P(b.data)-P(a.data)).concat(der);
  let h='<section class="card news"><div class="kicker">Comunicazioni dalla scuola</div>';
  if(!items.length) return h+'<p class="muted" style="margin:6px 0 0">Nessuna comunicazione al momento.</p></section>';
  h+=items.map(n=>'<div class="nitem"><h3>'+esc(n.titolo)+(isNew({inserito:n.inserito||n.data})&&!n.titolo.startsWith('Iscrizione')?NEW:'')+(n.esempio?EXA:'')+'</h3><div class="muted" style="font-size:.85rem">'+esc(longDate(P(n.data)))+'</div>'+(n.testo?'<p>'+esc(n.testo)+'</p>':'')+(n.scadenza?'<div class="exp">Scadenza: '+esc(longDate(P(n.scadenza)))+'</div>':'')+(n.file?'<div><a class="dl" href="'+esc(n.file.url)+'" download target="_blank" rel="noopener">'+DLICON+esc(n.file.nome||'Scarica il documento')+'</a></div>':'')+'</div>').join('');
  return h+'</section>';
}
function vOggi(){
  const out=[bannerBday(),newsHTML()]; const st=status(TODAY);
  out.push('<section class="card hero '+(st.open?'':'closed')+'"><div class="kicker" style="color:inherit;opacity:.75">Oggi</div><div class="date">'+esc(longDate(TODAY))+'</div><div class="sub">'+(st.open?'Scuola aperta · 8:10–16:10':esc(st.why)+' · scuola chiusa')+'</div></section>');
  if(st.open){
    const m=menuFor(TODAY);
    out.push('<section class="card"><div class="kicker">Menù di oggi</div>'+(m.missing?'<p class="muted">Menù non ancora disponibile.</p>':mealHTML(m.items)+alertHTML(TODAY))+'</section>');
  } else {
    let n=addD(TODAY,1); while(!status(n).open&&n<=S1) n=addD(n,1);
    if(n<=S1) out.push('<section class="card"><div class="kicker">Si riapre</div><h2 style="margin-top:4px">'+esc(longDate(n))+'</h2></section>');
  }
  // domani
  let t=addD(TODAY,1); const ts=status(t);
  if(t<=S1){ const m=menuFor(t);
    out.push('<section class="card"><div class="kicker">Domani · '+esc(longDate(t))+'</div>'+(ts.open?(m.missing?'<p class="muted">Menù non ancora disponibile.</p>':mealHTML(m.items)+alertHTML(t)):'<p class="muted" style="margin:6px 0 0"><b>'+esc(ts.why)+'</b>'+(ts.we||ts.closure?' · scuola chiusa':'')+'</p>')+'</section>'); }
  // prossimi
  const ev=[];
  DATA.chiusure.forEach(c=>{const a=P(c.dal); if(a>=TODAY) ev.push({d:a,txt:c.nome+' · chiusura',t:'c',al:c.al})});
  DATA.compleanni.forEach(b=>{const d=bdayDate(b); if(d>=TODAY) ev.push({d,txt:'Compleanno di '+b.nome+' · '+anni(b),k:'compleanni'})});
  DATA.feste.forEach(f=>{const d=P(f.data); if(d>=TODAY) ev.push({d,txt:'Festa di '+f.bimbo+(f.luogo?' · '+f.luogo:''),k:'compleanni'})});
  (DATA.eventi||[]).forEach(e=>{const a=P(e.dal),b=P(e.al||e.dal); if(b>=TODAY) ev.push({d:a<TODAY?TODAY:a,txt:e.titolo+(e.ora?' · ore '+e.ora:''),k:catKey(e.categoria),al:e.al,nu:isNew(e),ex:e.esempio})});
  ev.sort((a,b)=>a.d-b.d);
  if(ev.length) out.push('<div class="sec">In arrivo</div><ul class="list">'+ev.slice(0,6).map(e=>'<li class="card" style="padding:12px 14px"><div class="row"><b>'+esc(e.txt)+'</b></div>'+(e.k?'<div style="margin:4px 0">'+catPill(e.k)+(e.nu?NEW:'')+(e.ex?EXA:'')+'</div>':'')+'<div class="muted">'+esc(longDate(e.d))+(e.al&&e.al!==Y(e.d)?' – '+esc(longDate(P(e.al))):'')+'</div></li>').join('')+'</ul>');
  return out.join('');
}

let wk=null;
function vMenu(){
  if(!wk){ wk=monday(TODAY); if(wk<monday(M0)) wk=monday(M0); if(wk>monday(M1)) wk=monday(M1); }
  const mw=menuWeek(wk), end=addD(wk,4);
  const out=['<div class="nav"><button class="btn" id="wp" aria-label="Settimana precedente"'+(wk<=monday(M0)?' disabled':'')+'>‹</button><div class="lbl">'+wk.getDate()+' '+MESI[wk.getMonth()].slice(0,3)+' – '+end.getDate()+' '+MESI[end.getMonth()].slice(0,3)+'</div><button class="btn" id="wn" aria-label="Settimana successiva"'+(wk>=monday(M1)?' disabled':'')+'>›</button></div>'];
  out.push('<p class="muted" style="margin:0 2px;text-align:center">'+mw.n+'ª settimana del mese · menù della '+mw.menu+'ª settimana'+(mw.n>4?' (da confermare con la mensa)':'')+'</p>');
  for(let i=0;i<5;i++){
    const d=addD(wk,i), st=status(d), m=menuFor(d), isT=d.getTime()===TODAY.getTime();
    out.push('<section class="card day '+(isT?'is-today':'')+'"><div class="dc '+(st.open?'c'+i:'off')+'"><small>'+GIORNI_C[d.getDay()]+'</small><span>'+d.getDate()+'</span></div><div class="db">'+
      (st.open?(m.missing?'<p class="muted" style="margin:6px 0 0">Menù non ancora disponibile.</p>':mealHTML(m.items)+alertHTML(d)):'<p style="margin:8px 0 0;font-weight:800">'+esc(st.why)+'</p><p class="muted" style="margin:0">Scuola chiusa</p>')+'</div></section>');
  }
  return out.join('');
}

let cm=null, csel=null;
function vCal(){
  if(!cm){ cm=new Date(TODAY.getFullYear(),TODAY.getMonth(),1); if(cm<new Date(S0.getFullYear(),S0.getMonth(),1)) cm=new Date(S0.getFullYear(),S0.getMonth(),1); if(cm>new Date(S1.getFullYear(),S1.getMonth(),1)) cm=new Date(S1.getFullYear(),S1.getMonth(),1);}
  const first=new Date(cm.getFullYear(),cm.getMonth(),1), last=new Date(cm.getFullYear(),cm.getMonth()+1,0);
  const minM=new Date(S0.getFullYear(),S0.getMonth(),1), maxM=new Date(S1.getFullYear(),S1.getMonth(),1);
  const out=['<div class="nav"><button class="btn" id="cp" aria-label="Mese precedente"'+(cm<=minM?' disabled':'')+'>‹</button><div class="lbl">'+MESI[cm.getMonth()]+' '+cm.getFullYear()+'</div><button class="btn" id="cn" aria-label="Mese successivo"'+(cm>=maxM?' disabled':'')+'>›</button></div>'];
  out.push('<button class="todaybtn" id="ct">Torna a oggi</button>');
  let g='<section class="card"><div class="grid">'+['L','M','M','G','V','S','D'].map(x=>'<div class="h">'+x+'</div>').join('');
  const lead=(first.getDay()+6)%7; for(let i=0;i<lead;i++) g+='<div class="cell empty"></div>';
  for(let n=1;n<=last.getDate();n++){
    const d=new Date(cm.getFullYear(),cm.getMonth(),n), st=status(d);
    const cls=['cell']; if(st.we) cls.push('we'); if(d<S0||d>S1) cls.push('out'); else if(st.closure) cls.push('cl');
    if(d.getTime()===TODAY.getTime()) cls.push('today'); if(csel&&Y(d)===csel) cls.push('sel');
    const cs=catsOn(d).filter(k=>filt[k]);
    g+='<button class="'+cls.join(' ')+'" data-d="'+Y(d)+'" aria-label="'+esc(longDate(d))+'">'+n+'<span class="dots">'+cs.map(k=>'<i style="background:'+CATS[k].col+'"></i>').join('')+'</span></button>';
  }
  g+='</div><div class="chips2" style="margin-top:12px">'+Object.keys(CATS).map(k=>'<button class="fc'+(filt[k]?' on':'')+'" data-cat="'+k+'" aria-pressed="'+(filt[k]?'true':'false')+'"><i style="background:'+CATS[k].col+'"></i>'+CATS[k].nome+'</button>').join('')+'</div><div class="legend" style="margin-top:10px"><span><i style="background:var(--coral-soft);border:2px solid var(--coral)"></i>Scuola chiusa</span><span><i style="border:2px solid var(--sky)"></i>Oggi</span></div></section>';
  out.push(g);
  if(csel){ const d=P(csel), st=status(d), m=menuFor(d), bs=bdaysOn(d);
    let h='<section class="card"><h2>'+esc(longDate(d))+'</h2>';
    if(st.open){ h+='<p class="muted" style="margin:4px 0 0">Scuola aperta</p>'+(m.missing?'<p class="muted">Menù non ancora disponibile.</p>':mealHTML(m.items)+alertHTML(d)); }
    else h+='<p style="margin:6px 0 0;font-weight:800">'+esc(st.why)+'</p><p class="muted" style="margin:0">Scuola chiusa</p>';
    bs.forEach(b=>{h+='<div class="party">'+catPill('compleanni')+'<br><b>Compleanno di '+esc(b.nome)+'</b> · '+anni(b)+'</div>'});
    DATA.feste.filter(f=>f.data===csel).forEach(f=>{h+='<div class="party">'+catPill('compleanni')+'<br><b>Festa di '+esc(f.bimbo)+'</b>'+(f.ora?' · ore '+esc(f.ora):'')+(f.luogo?'<br>'+esc(f.luogo):'')+'</div>'});
    evOn(d).forEach(e=>{h+=evHTML(e)});
    out.push(h+'</section>'); }
  { const ms=cm.getMonth(), my=cm.getFullYear(), items=[];
    DATA.compleanni.forEach(b=>{const d=bdayDate(b); if(d.getMonth()===ms&&d.getFullYear()===my) items.push({d,k:'compleanni',t:'Compleanno di '+b.nome+' · '+anni(b)})});
    DATA.feste.forEach(f=>{const d=P(f.data); if(d.getMonth()===ms&&d.getFullYear()===my) items.push({d,k:'compleanni',t:'Festa di '+f.bimbo+(f.ora?' · ore '+f.ora:'')+(f.luogo?' · '+f.luogo:'')})});
    (DATA.eventi||[]).forEach(e=>{const a=P(e.dal),z=P(e.al||e.dal); if(a<=last&&z>=first) items.push({d:a<first?first:a,k:catKey(e.categoria),t:e.titolo+(e.ora?' · ore '+e.ora:''),nu:isNew(e),ex:e.esempio})});
    const vis=items.filter(i=>filt[i.k]).sort((a,b)=>a.d-b.d);
    out.push('<div class="sec">In programma a '+MESI[ms]+'</div>'+(vis.length?'<ul class="list">'+vis.map(i=>'<li class="card mi" style="padding:12px 14px"><div class="dd"><small>'+GIORNI_C[i.d.getDay()]+'</small><span>'+i.d.getDate()+'</span></div><div style="min-width:0"><b>'+esc(i.t)+'</b><div style="margin-top:4px">'+catPill(i.k)+(i.nu?NEW:'')+(i.ex?EXA:'')+'</div></div></li>').join('')+'</ul>':'<p class="muted" style="margin:0 2px">Niente in programma con i filtri scelti.</p>')); }
  out.push('<div class="sec">Chiusure della scuola</div><ul class="list">'+DATA.chiusure.map(c=>{const a=P(c.dal),b=P(c.al||c.dal),past=b<TODAY;
    const r=(c.al&&c.al!==c.dal)?a.getDate()+' '+MESI[a.getMonth()].slice(0,3)+' – '+b.getDate()+' '+MESI[b.getMonth()].slice(0,3):a.getDate()+' '+MESI[a.getMonth()];
    return '<li class="card" style="padding:12px 14px;'+(past?'opacity:.55':'')+'"><div class="row"><b>'+esc(c.nome)+'</b><span class="muted">'+r+'</span></div></li>'}).join('')+'</ul>');
  return out.join('');
}

function vFeste(){
  const list=DATA.compleanni.slice().sort((a,b)=>bdayDate(a)-bdayDate(b));
  const out=['<div class="sec" style="margin-top:0">Compleanni dell\'anno scolastico</div>'];
  out.push('<ul class="list">'+list.map(b=>{
    const d=bdayDate(b), st=status(d), past=d<TODAY, fs=festeOf(b.nome);
    const note=!st.open?'<div class="muted">Cade in un giorno di scuola chiusa ('+esc(st.why.toLowerCase())+')</div>':'<div class="muted">A scuola</div>';
    const fest=fs.map(f=>'<div class="party"><b>Festa</b> · '+esc(longDate(P(f.data)))+(f.ora?' · ore '+esc(f.ora):'')+(f.luogo?'<br>'+esc(f.luogo):'')+(f.note?'<br>'+esc(f.note):'')+(f.locandina?'<img src="'+esc(f.locandina)+'" alt="Invito alla festa di '+esc(b.nome)+'">':'')+'</div>').join('');
    return '<li class="card bd-wrap'+(past?' past':'')+'" style="'+(past?'opacity:.6':'')+'"><div class="bd"><div class="dc"><small>'+MESI[d.getMonth()].slice(0,3)+'</small><span>'+d.getDate()+'</span></div><div><div class="nm">'+esc(b.nome)+'</div><div class="muted">'+esc(GIORNI[d.getDay()])+' '+d.getDate()+' '+MESI[d.getMonth()]+'</div><div class="age">'+anni(b)+'</div>'+note+'</div></div>'+fest+'</li>'}).join('')+'</ul>');
  if(!DATA.feste.length) out.push('<section class="card"><div class="kicker">Feste di compleanno</div><p style="margin:6px 0 0" class="muted">Nessuna festa comunicata per ora. Quando un genitore ne organizza una, qui compaiono data, orario, luogo e invito.</p></section>');
  return out.join('');
}

const VIEWS={home:vOggi,menu:vMenu,calendario:vCal,compleanni:vFeste};
const ICON={
 home:'<svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>',
 menu:'<svg viewBox="0 0 24 24"><path d="M4 11h16a8 8 0 0 1-16 0z"/><path d="M8 7c0-2 2-2 2-4M13 7c0-2 2-2 2-4"/></svg>',
 calendario:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
 compleanni:'<svg viewBox="0 0 24 24"><path d="M4 21h16v-7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2z"/><path d="M12 12V8M12 8c-1.5-1-1.5-3 0-4 1.5 1 1.5 3 0 4z"/></svg>'};
const LABEL={home:'Home',menu:'Menù',calendario:'Calendario',compleanni:'Compleanni'};
let cur='home',animNext=false;
function render(){
  document.getElementById('main').innerHTML='<div class="view'+(animNext?' anim':'')+'">'+VIEWS[cur]()+'</div>';animNext=false;
  document.getElementById('tabs').innerHTML=Object.keys(VIEWS).map(k=>'<button data-v="'+k+'"'+(k===cur?' aria-current="page"':'')+'>'+ICON[k]+LABEL[k]+'</button>').join('');
  const q=id=>document.getElementById(id);
  if(q('wp')){q('wp').onclick=()=>{wk=addD(wk,-7);render()};q('wn').onclick=()=>{wk=addD(wk,7);render()}}
  if(q('ct')) q('ct').onclick=()=>{cm=new Date(TODAY.getFullYear(),TODAY.getMonth(),1);const m0=new Date(S0.getFullYear(),S0.getMonth(),1),m1=new Date(S1.getFullYear(),S1.getMonth(),1);if(cm<m0)cm=m0;if(cm>m1)cm=m1;csel=(TODAY>=S0&&TODAY<=S1)?Y(TODAY):null;render()};
  if(q('cp')){q('cp').onclick=()=>{cm=new Date(cm.getFullYear(),cm.getMonth()-1,1);csel=null;render()};q('cn').onclick=()=>{cm=new Date(cm.getFullYear(),cm.getMonth()+1,1);csel=null;render()}}
  document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{filt[b.dataset.cat]=filt[b.dataset.cat]?0:1;render()});
  document.querySelectorAll('.cell[data-d]').forEach(b=>b.onclick=()=>{csel=b.dataset.d;render();const t=document.querySelector('#main .card h2');if(t)t.scrollIntoView({behavior:'smooth',block:'nearest'})});
  document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>go(b.dataset.v));
}
function go(v){cur=v;animNext=true;try{history.replaceState(null,'','#'+v)}catch(e){}window.scrollTo(0,0);render()}
/* ---- Foglio Google (facoltativo): incolla qui l'ID del foglio per leggere eventi, avvisi, variazioni, feste, compleanni e chiusure ---- */
const SHEET={id:'135rSwKDXdRaaMw0mGu15CwmJXLWM0po-l3yEzTMhpDE',tabs:{eventi:'Eventi',comunicazioni:'Comunicazioni',variazioni:'Variazioni menù',feste:'Feste',compleanni:'Compleanni',chiusure:'Chiusure'}};
const NEED={eventi:'titolo',comunicazioni:'titolo',variazioni:'testo',feste:'bimbo',compleanni:'nome',chiusure:'nome'};
function parseCSV(t){const rows=[];let r=[],f='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','){r.push(f);f='' }else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;r.push(f);rows.push(r);r=[];f=''}else f+=c}if(f!==''||r.length){r.push(f);rows.push(r)}return rows}
const normH=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');
const nd=t=>{t=String(t||'').trim();let m=t.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[1]+'-'+m[2]+'-'+m[3];m=t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);return m?m[3]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[1]).padStart(2,'0'):''};
const fl=(u,n)=>u?{nome:n||'Scarica il documento',url:u}:null;
const MAP={
 eventi:o=>({titolo:o.titolo,categoria:o.categoria,dal:nd(o.dal||o.data),al:nd(o.al),ora:o.ora,luogo:o.luogo,testo:o.descrizione,costo:o.costo,scadenza:nd(o.scadenza),inserito:nd(o.inserito),file:fl(o.documento_url,o.documento_nome)}),
 comunicazioni:o=>({data:nd(o.data),titolo:o.titolo,testo:o.testo,scadenza:nd(o.scadenza),inserito:nd(o.inserito),file:fl(o.documento_url,o.documento_nome)}),
 variazioni:o=>({data:nd(o.data),testo:o.testo}),
 feste:o=>({bimbo:o.bimbo,data:nd(o.data),ora:o.ora,luogo:o.luogo,note:o.note,locandina:o.locandina_url}),
 compleanni:o=>({nome:o.nome,giorno:+o.giorno,mese:+o.mese,anni:+o.anni||undefined}),
 chiusure:o=>({dal:nd(o.dal),al:nd(o.al)||undefined,nome:o.nome})};
const KEEP={eventi:o=>o.titolo&&o.dal,comunicazioni:o=>o.titolo&&o.data,variazioni:o=>o.data&&o.testo,feste:o=>o.bimbo&&o.data,compleanni:o=>o.nome&&o.giorno&&o.mese,chiusure:o=>o.nome&&o.dal};
async function loadSheet(){
  if(!SHEET.id) return;
  try{
    const out={};
    for(const [k,name] of Object.entries(SHEET.tabs)){
      const r=await fetch('https://docs.google.com/spreadsheets/d/'+SHEET.id+'/gviz/tq?tqx=out:csv&sheet='+encodeURIComponent(name));
      if(!r.ok) throw new Error('foglio');
      const rows=parseCSV(await r.text()).filter(x=>x.some(c=>c.trim()!==''));
      if(!rows.length||!rows[0].map(normH).includes(NEED[k])) throw new Error('scheda '+name);
      const h=rows[0].map(normH);
      out[k]=rows.slice(1).map(x=>{const o={};h.forEach((c,i)=>o[c]=(x[i]||'').trim());return MAP[k](o)}).filter(KEEP[k]);
    }
    Object.assign(DATA,out); render();
  }catch(e){}
}
const h=(location.hash||'').slice(1); if(VIEWS[h]) cur=h;
render();
loadSheet();
